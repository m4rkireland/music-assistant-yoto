[project]
name = "music-assistant-yoto"
version = "0.3.0"
description = "A read-only Yoto card-library provider for Music Assistant"
requires-python = ">=3.14"
dependencies = [
  "music-assistant-models==1.1.129.post1",
  "yoto-api==4.3.2",
]

[project.optional-dependencies]
dev = [
  "mypy==2.1.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
disallow_subclassing_any = false
packages = ["yoto"]
