name: Music Assistant Yoto
version: 2.9.9-yoto.5
slug: music_assistant_yoto
description: >-
  Music Assistant 2.9.9 with the experimental unofficial read-only Yoto
  provider layered onto the immutable official server image.
url: https://github.com/m4rkireland/music-assistant-yoto
arch:
  - amd64
  - aarch64
homeassistant_api: true
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant Yoto
panel_admin: false
uart: false
apparmor: true
map:
  - media:rw
  - ssl:ro
init: false
tmpfs: true
backup: cold
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
stage: experimental
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
